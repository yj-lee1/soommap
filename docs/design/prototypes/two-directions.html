 data.places.forEach(p=>{const[x,y]=projection([p.coordinate.longitude,p.coordinate.latitude]);make('circle',{cx:x,cy:y,r:p.id===s.place?15:10,class:'map-point-halo',opacity:p.id===s.place?1:0,'data-place':p.id});make('circle',{cx:x,cy:y,r:6,class:`map-point ${p.id===s.place?'active':''}`});make('text',{x:x+(p.id==='banpo'?-13:13),y:y-11,class:'place-label','text-anchor':p.id==='banpo'?'end':'start'},p.id==='banpo'?'반포':'여의도');});
}
function inspect(phone,s){const pts=points(s).filter(p=>scenario!=='gap'||p.m!==1140),m=Number(phone.querySelector('input[type=range]').value),end=m+60;
 phone.querySelector('output').textContent=`${hhmm(m)}–${hhmm(end)}`;
 phone.querySelector('input[type=range]').setAttribute('aria-valuetext',`${hhmm(m)}부터 ${hhmm(end)}까지 살펴보기`);
 const x=(m-1080)/180*100;phone.querySelector('.stay-span').style.left=`${x}%`;phone.querySelector('.stay-span').style.width=`${100/3}%`;phone.querySelector('.cursor').style.left=`${x}%`;
 const around=t=>{const exact=pts.find(p=>p.m===t);if(exact)return {exact,p:exact,q:exact};const p=pts.filter(p=>p.m<t).at(-1),q=pts.find(p=>p.m>t);return p&&q&&q.m-p.m<=60?{p,q,exact:null}:null;};
 const start=around(m),finish=around(end);const valid=start&&finish&&!(scenario==='gap'&&m<1200&&end>1080);
 const box=phone.querySelector('.inspection');
 if(!valid){box.innerHTML=`<strong>${hhmm(m)}–${hhmm(end)} · 평가 보류</strong><br>19시 예측 표본이 없어 전체 체류 구간을 평가할 수 없어요.<br><span class="estimate-mark">인구 보간값도 만들지 않았어요.</span>`;return;}
 const {p,q,exact}=start,w=exact?0:(m-p.m)/(q.m-p.m),min=Math.round((p.min*(1-w)+q.min*w)/100)*100,max=Math.round((p.max*(1-w)+q.max*w)/100)*100;
 const used=pts.filter(v=>v.m>=start.p.m&&v.m<=finish.q.m);const satisfies=used.every(v=>v.l==='보통');
 box.innerHTML=`<strong>${hhmm(m)} ${exact?'공식 예측 시점':'도착 전후 표본'}</strong><br>${exact?p.l:`${hhmm(p.m)} ${p.l} → ${hhmm(q.m)} ${q.l}`}<br><span class="estimate-mark">${exact?'공식 인구 범위 (예시)':'숨맵 인구 추정 · 선형 보간'}</span> 약 ${min.toLocaleString('ko-KR')}–${max.toLocaleString('ko-KR')}명<br>${satisfies?'체류 평가 표본은 모두 보통이에요.':'체류 전후 표본에 선호 초과 단계가 포함돼요.'}`;
}
function timeline(phone,s){const pts=points(s);phone.querySelector('.samples').innerHTML=pts.map((p,i)=>`<div class="sample ${scenario==='gap'&&i===1?'missing':''}" style="left:${i/3*100}%"><span>${p.m/60}시</span><span class="dot"></span><span>${scenario==='gap'&&i===1?'누락':p.l}</span></div>`).join('');phone.querySelector('.gap-zone').hidden=scenario!=='gap';phone.querySelector('.observation').innerHTML=`<span class="obs-square"></span>현재 관측 · 17:40 ${s.place==='banpo'?'보통':'약간 붐빔'} (예시)`;phone.querySelector('input[type=range]').value=s.arrival;inspect(phone,s);}
function locks(phone,s){for(const type of ['place','time']){const b=phone.querySelector(`[data-action=${type}]`);b.setAttribute('aria-pressed',String(s[type+'Pin']));b.querySelector('span').textContent=(type==='place'?'여의도':'18:20')+(s[type+'Pin']?' 고정됨':' 고정');const icon=b.querySelector('svg,i');if(icon)icon.replaceWith(Object.assign(document.createElement('i'),{}));const placeholder=b.querySelector('i');placeholder.setAttribute('data-lucide',s[type+'Pin']?'lock-keyhole':'lock-open');placeholder.setAttribute('aria-hidden','true');}
 phone.querySelector('[data-action=compare]').disabled=!s.dirty;phone.querySelector('.lock-notice').textContent=s.dirty?'고정 조건을 바꿨어요. 다시 비교하면 결과에 반영돼요.':s.placePin&&s.timePin?'여의도와 18:20 고정 유지 · 혼잡 선호는 별도로 확인해요.':s.timePin?'18:20 고정 유지 · 바꿀 수 있는 장소만 비교했어요.':s.placePin?'여의도 고정 유지 · 바꿀 수 있는 시간만 비교했어요.':'유지할 조건을 고르면, 바꿀 수 있는 부분만 다시 비교해요.';
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
function showResult(phone,s,changed=false){s.stage='recommend';phone.querySelector('.recommendation').classList.remove('executing');phone.querySelector('.decision').hidden=false;phone.querySelector('.execution').hidden=true;
 const name=placeNames[s.place],unmet=scenario==='unmet'||(s.placePin&&s.timePin),blocked=['gap','quota','gps'].includes(scenario);
 phone.querySelector('.rec-name').textContent=name;phone.querySelector('.destination-sub').textContent=`${s.place==='banpo'?'반포':'여의도'}안내센터 도착 기준`;
 phone.querySelector('.large-time').textContent=hhmm(s.arrival);phone.querySelector('.delta').textContent=s.arrival===1100?'원래 도착시각 유지':'원래보다 40분 늦게';
 phone.querySelector('.anchor-top span').textContent=scenario==='gps'?'출발지 미정 · 60분 산책':'서울역 출발 · 60분 산책';
 phone.querySelector('.status-text').textContent=blocked?'비교 보류':unmet?'선호 불충족 · 참고 계획':s.place==='banpo'?'시각 유지 · 장소만 변경':'장소 유지 · 시각만 변경';
 phone.querySelector('.kept').textContent=s.place==='banpo'?'18:20 도착 · 산책 60분':'여의도 · 산책 60분';
 phone.querySelector('.changed').textContent=s.place==='banpo'?'여의도 → 반포':s.arrival===1100?'변경 없음 · 두 고정 조건 유지':'도착 18:20 → 19:00';
 phone.querySelector('.reason').innerHTML=unmet?'고정한 조건은 그대로 지켰어요. 다만 <strong>산책 구간에 약간 붐빔 예측이 포함</strong>되어, 혼잡 선호를 충족한다고 말할 수 없어요.':s.place==='banpo'?'18:20은 그대로 지켰어요. <strong>반포의 체류 전후 표본이 모두 보통</strong>이라 장소만 바꾸는 안을 골랐어요.':'장소를 바꾸지 않아도 괜찮아요. <strong>19~20시 공식 예측 표본은 모두 보통</strong>이라, 도착만 40분 늦추는 안을 골랐어요.';
 phone.querySelector('.journey-time span').textContent=`${hhmm(s.arrival)} 도착 → ${hhmm(s.arrival+60)} 산책 종료`;
 const warning=phone.querySelector('.warning-box');warning.hidden=!blocked&&!unmet;
 const cases={gap:['19시 예측이 비어 있어요.','도착부터 산책 종료까지의 자료가 이어지지 않아 이 계획의 추천·확정을 보류했어요.'],quota:['이동시간 조회 한도에 도달했어요.','출발지와 고정 조건은 남아 있어요. 도착 시간대를 직접 정하거나 나중에 다시 계산할 수 있어요.'],gps:['현재 위치를 확인할 수 없어요.','권한을 다시 요청하지 않고, 출발역 검색으로 계속할 수 있어요.']};
 const v=cases[scenario]||['혼잡 선호를 충족하지 못했어요.','필수 조건은 유지한 참고 계획이에요. 선호를 충족하는 추천으로 표시하지 않습니다.'];warning.innerHTML=`<h3>${v[0]}</h3><p>${v[1]}</p>`;
 const notice=phone.querySelector('.mobile-notice');notice.hidden=scenario!=='gps';if(scenario==='gps')notice.innerHTML='<h2>출발역으로 계속할 수 있어요.</h2><label>출발역 검색<input type="search" aria-label="출발역 검색" placeholder="서울역, 홍대입구"></label><button type="button" data-action="station">서울역 · 1호선 선택</button>';
 phone.querySelector('.action-area').hidden=blocked;phone.querySelector('.result-head').hidden=scenario==='quota'||scenario==='gps';phone.querySelector('.change-list').hidden=scenario==='quota'||scenario==='gps';phone.querySelector('.reason').hidden=blocked;phone.querySelector('.journey-time').hidden=scenario==='quota'||scenario==='gps';phone.querySelector('.timeline-section').hidden=scenario==='quota'||scenario==='gps';
 timeline(phone,s);locks(phone,s);map(phone,s);if(changed){animate(phone.querySelector('.result-head'));animate(phone.querySelector('.changed'));animate(phone.querySelector('.reason'));}
}
function execute(phone,s,confirmed=false){const rec=phone.querySelector('.recommendation'),box=phone.querySelector('.execution');s.stage=confirmed?'confirmed':'selected';const before=rec.getBoundingClientRect();phone.querySelector('.decision').hidden=true;box.hidden=false;rec.classList.add('executing');phone.querySelector('.status-text').textContent=confirmed?'계획 확정 · 길찾기로 이어가기':'선택 유지 · 자료 재확인';
 box.innerHTML=`<h3>${confirmed?'이 계획으로 나가볼까요?':'이 계획을 확인해주세요.'}</h3><div class="destination"><span>출발</span><div><strong>서울역 · 1호선</strong><small>선택한 출발역 대표 위치</small></div><span>도착</span><div><strong>${placeNames[s.place]} · ${s.place==='banpo'?'반포':'여의도'}안내센터</strong><small>${hhmm(s.arrival)} 도착 · 산책 60분</small></div></div><p class="small">${confirmed?'출발지와 접근 지점을 다시 입력할 필요 없어요.':'예시 자료 재확인 완료 · 선택한 장소와 시각을 유지했어요.'}</p>${(scenario==='unmet'||s.placePin&&s.timePin)?'<div class="warning-box">고정 조건은 충족하지만, 혼잡 선호는 충족하지 못하는 참고 계획이에요.</div>':''}${confirmed?'<button type="button" data-action="naver" class="primary">네이버지도로 길찾기</button><button type="button" data-action="kakao">카카오맵으로 길찾기</button><p class="small">대중교통으로 연결 · 지도 앱에서 현재 경로를 다시 확인해요.</p>':'<button type="button" data-action="confirm" class="primary">확인하고 계획 확정</button>'}<button type="button" data-action="back" class="quiet">비교로 돌아가기</button><p class="nav-feedback small" role="status" aria-live="polite"></p>`;
 const after=rec.getBoundingClientRect();if(!settings.reduced&&!media.matches){rec.animate([{height:`${before.height}px`},{height:`${after.height}px`}],{duration:300,easing:'cubic-bezier(.2,.7,.2,1)'});box.animate([{transform:'translateY(12px)',opacity:.4},{transform:'translateY(0)',opacity:1}],{duration:260,easing:'ease-out'});}
 box.querySelector('button').focus();phone.querySelector('.lock-notice').textContent=confirmed?'선택한 장소·시각이 실행 카드로 이어졌어요.':'선택한 장소·시각은 유지하고 자료를 다시 확인했어요.';
}
root.querySelectorAll('.phone').forEach(phone=>{const s={placePin:false,timePin:false,dirty:false,place:'yeouido',arrival:1140,stage:'recommend'};states.set(phone,s);phone.innerHTML=shell(phone.dataset.theme);showResult(phone,s);new ResizeObserver(()=>map(phone,s)).observe(phone.querySelector('.map-wrap'));
 phone.querySelector('input[type=range]').addEventListener('input',()=>inspect(phone,s));
 phone.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action;
 if(['place','time'].includes(action)){s[action+'Pin']=!s[action+'Pin'];s.dirty=true;if(s.stage!=='recommend')showResult(phone,s);else locks(phone,s);phone.querySelector('[data-action=select]').disabled=true;return;}
 if(action==='compare'){s.dirty=false;s.place=s.timePin&&!s.placePin?'banpo':'yeouido';s.arrival=s.timePin?1100:1140;if(scenario==='unmet'){s.place='yeouido';s.arrival=1100;}phone.querySelector('[data-action=select]').disabled=false;showResult(phone,s,true);return;}
 if(action==='select'){execute(phone,s);return;}if(action==='confirm'){execute(phone,s,true);return;}if(action==='back'){showResult(phone,s);phone.querySelector('[data-action=select]').focus({preventScroll:true});return;}
 if(action==='station'){scenario='normal';root.querySelector('#sm-scenario').value='normal';states.forEach((state,p)=>showResult(p,state));return;}
 if(action==='naver'||action==='kakao'){phone.querySelector('.nav-feedback').textContent='동작 검토용입니다. 외부 지도나 위치 권한을 실제로 열지 않았어요.';}
 });
});
root.querySelector('#sm-scenario').addEventListener('change',event=>{scenario=event.target.value;states.forEach((s,p)=>{s.place='yeouido';s.arrival=scenario==='unmet'?1100:1140;s.placePin=false;s.timePin=false;s.dirty=false;p.querySelector('[data-action=select]').disabled=false;showResult(p,s);});});
function motion(){root.dataset.reduced=String(settings.reduced);root.querySelector('#sm-motion').checked=settings.reduced;}
root.querySelector('#sm-motion').addEventListener('change',e=>{settings.reduced=e.target.checked;motion();});media.addEventListener('change',e=>{if(e.matches)settings.reduced=true;motion();});motion();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:motion});t.addToggle(settings,'reduced',{label:'동작 줄이기'});}
})();
</script>
